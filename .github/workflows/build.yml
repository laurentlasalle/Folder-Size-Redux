name: Build

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: 'Version to release, such as 0.1.0 (creates the tag v<version> on this commit and its GitHub release). Leave empty for a normal build.'
        required: false
        default: ''

jobs:
  build:
    runs-on: windows-latest
    # contents: write lets a tag build create the GitHub release (see the last step).
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: microsoft/setup-msbuild@v2

      - name: Check that the translations are up to date
        shell: pwsh
        run: python FolderSize/Lang/build_lang.py --check

      - name: Build (Release x64)
        shell: pwsh
        run: |
          msbuild FolderSize\FolderSize.sln /m /nologo /v:minimal `
            /p:Configuration=Release /p:Platform=x64 `
            "/flp:logfile=build-errors.log;errorsonly"
          $code = $LASTEXITCODE
          # Report each compiler/linker error as an annotation, so errors are
          # visible on the run summary page without opening the full log.
          if ($code -ne 0 -and (Test-Path build-errors.log)) {
            Get-Content build-errors.log | Select-Object -Unique | ForEach-Object { "::error::$_" }
          }
          exit $code

      - name: Build installer (FolderSize64.msi)
        shell: pwsh
        working-directory: FolderSize\MSI
        run: |
          # The installer's File table records each file's size; update it
          # to match the files that were just built.
          $table = 'tables64\File.idt'
          $lines = Get-Content $table
          for ($i = 3; $i -lt $lines.Count; $i++) {
            if (-not $lines[$i]) { continue }
            $cols = $lines[$i] -split "`t"
            $name = ($cols[2] -split '\|')[-1]
            $cols[3] = (Get-Item "..\Release\x64\$name").Length
            $lines[$i] = $cols -join "`t"
          }
          Set-Content $table $lines -Encoding ascii

          # Give every build its own product code and package code, so installing a new
          # build replaces the previous one (major upgrade, see tables64\Upgrade.idt).
          $productCode = [guid]::NewGuid().ToString('B').ToUpper()
          $packageCode = [guid]::NewGuid().ToString('B').ToUpper()
          (Get-Content tables64\Property.idt) -replace '^ProductCode\t.*', "ProductCode`t$productCode" |
            Set-Content tables64\Property.idt -Encoding ascii
          (Get-Content tables64\_SummaryInformation.idt) -replace '^9\t.*', "9`t$packageCode" |
            Set-Content tables64\_SummaryInformation.idt -Encoding ascii

          cmd /c BuildMSI64.bat
          if (-not (Test-Path FolderSize64.msi)) { throw 'FolderSize64.msi was not created' }

      - name: Upload build
        uses: actions/upload-artifact@v5
        with:
          name: FolderSizeRedux-x64
          if-no-files-found: error
          path: |
            FolderSize/MSI/FolderSize64.msi
            FolderSize/Release/x64/FolderSize.exe
            FolderSize/Release/x64/FolderSizeSvc.exe
            FolderSize/Release/x64/FolderSize.cpl
            FolderSize/Release/x64/CLClient.exe

      # Publishes a GitHub release with the installer and a portable .zip, either when a tag such
      # as v0.1.0 is pushed, or when this workflow is run by hand (Actions > Build > Run workflow)
      # with a version to release: the tag is then created on the commit that was built. The
      # version must match ProductVersion in the installer (tables64\Property.idt), and the
      # release notes come from .github/release-notes/v<version>.md. If the release already
      # exists (created on GitHub's site), its files and notes are replaced.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = '${{ inputs.release }}'
          if (-not $version) { $version = '${{ github.ref_name }}'.Substring(1) }
          $tag = "v$version"
          $property = Get-Content FolderSize\MSI\tables64\Property.idt | Where-Object { $_ -match '^ProductVersion\t' }
          $productVersion = ($property -split "`t")[1]
          if ($productVersion -ne $version) { throw "Tag $tag doesn't match ProductVersion $productVersion" }
          $notes = ".github\release-notes\$tag.md"
          if (-not (Test-Path $notes)) { throw "Missing release notes: $notes" }

          New-Item -ItemType Directory dist | Out-Null
          Copy-Item FolderSize\MSI\FolderSize64.msi "dist\FolderSizeRedux-$version-x64.msi"

          # Portable version: the three programs, with the README and the license.
          $portable = "FolderSizeRedux-$version-x64-portable"
          New-Item -ItemType Directory "dist\$portable" | Out-Null
          Copy-Item FolderSize\Release\x64\FolderSize.exe, FolderSize\Release\x64\FolderSizeSvc.exe, `
            FolderSize\Release\x64\FolderSize.cpl, README.md, COPYING "dist\$portable"
          Compress-Archive "dist\$portable\*" "dist\$portable.zip"

          $files = "dist\FolderSizeRedux-$version-x64.msi", "dist\$portable.zip"
          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @files --clobber
            gh release edit $tag --title "Folder Size Redux $version" --notes-file $notes
          } else {
            gh release create $tag @files --target '${{ github.sha }}' --title "Folder Size Redux $version" --notes-file $notes
          }
          if ($LASTEXITCODE -ne 0) { throw 'Publishing the release failed' }
